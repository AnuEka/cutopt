<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CutOptima — Material Cutting Optimizer</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #111418;
  --surface: #181d24;
  --surface2: #1e252e;
  --border: #2a323d;
  --accent: #f5a623;
  --text: #c8d0da;
  --text-dim: #6b7889;
  --text-bright: #edf2f8;
  --green: #4caf82;
  --red: #e05252;
  --blue: #5b9bd5;
  --radius: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  background-image:
    linear-gradient(rgba(245,166,35,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,166,35,0.025) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 13px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  height: 58px;
  flex-shrink: 0;
}
.logo {
  font-family: 'Rajdhani', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.logo span { color: var(--text-bright); }
.tagline {
  color: var(--text-dim);
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  border-left: 1px solid var(--border);
  padding-left: 16px;
}
.mode-tabs {
  margin-left: auto;
  display: flex;
  gap: 3px;
  background: var(--bg);
  padding: 3px;
  border-radius: 7px;
  border: 1px solid var(--border);
}
.mode-tab {
  padding: 7px 18px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-family: 'Rajdhani', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  border-radius: 5px;
  transition: all 0.18s;
}
.mode-tab.active { background: var(--accent); color: #111; }
.mode-tab:hover:not(.active) { background: var(--surface2); color: var(--text); }

/* LAYOUT */
.app-body {
  display: flex;
  height: calc(100vh - 58px);
  overflow: hidden;
}
.left-panel {
  width: 370px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.right-panel {
  flex: 1;
  overflow-y: auto;
  padding: 22px 26px;
}

/* SECTION LABEL */
.slabel {
  font-family: 'Rajdhani', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 9px;
}

/* MATERIAL GRID */
.mat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}
.mat-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
  font-family: 'Barlow', sans-serif;
  line-height: 1.3;
}
.mat-btn:hover { border-color: var(--accent); color: var(--text-bright); }
.mat-btn.active { border-color: var(--accent); background: rgba(245,166,35,0.08); color: var(--accent); }
.mat-icon { font-size: 16px; display: block; margin-bottom: 3px; }
.mat-name { font-size: 12px; font-weight: 500; }

/* FIELDS */
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.frow-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px; text-transform: uppercase; }
.field select,
.field input[type="number"],
.field input[type="text"] {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text-bright);
  padding: 7px 9px;
  border-radius: var(--radius);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}
.field select:focus, .field input:focus { border-color: var(--accent); }
.field select option { background: var(--surface); }
.check-row {
  display: flex; align-items: center; gap: 7px;
  cursor: pointer; user-select: none; margin-top: 2px;
}
.check-row input { accent-color: var(--accent); width: 13px; height: 13px; }
.check-row span { font-size: 11px; color: var(--text-dim); }

/* CUT ROWS */
.cut-header {
  display: grid;
  padding: 0 6px 0 28px;
  margin-bottom: 4px;
}
.ch-1d { grid-template-columns: 1fr 72px 44px; gap: 6px; }
.ch-2d { grid-template-columns: 1fr 68px 68px 44px; gap: 6px; }
.ch-label { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; text-align: center; }

.cut-row {
  display: grid;
  align-items: center;
  gap: 6px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 7px;
  margin-bottom: 5px;
  transition: border-color 0.15s;
}
.cr-1d { grid-template-columns: 16px 1fr 72px 44px 26px; }
.cr-2d { grid-template-columns: 16px 1fr 68px 68px 44px 26px; }

.cut-row input[type="text"],
.cut-row input[type="number"] {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border);
  color: var(--text-bright);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 3px 2px;
  outline: none;
  width: 100%;
  text-align: center;
}
.cut-row input[type="text"] { text-align: left; }
.cut-row input:focus { border-bottom-color: var(--accent); }
.cut-row input::placeholder { color: var(--text-dim); font-size: 11px; }

.cdot {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}
.del-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  width: 24px; height: 24px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
  line-height: 1;
}
.del-btn:hover { background: rgba(224,82,82,0.15); border-color: var(--red); color: var(--red); }
.add-btn {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-dim);
  padding: 7px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  text-align: center;
  transition: all 0.15s;
  width: 100%;
  margin-top: 2px;
}
.add-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(245,166,35,0.04); }

/* OPTIMIZE BTN */
.opt-btn {
  background: var(--accent);
  color: #111;
  border: none;
  padding: 13px 20px;
  border-radius: var(--radius);
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  width: 100%;
  transition: all 0.18s;
}
.opt-btn:hover { background: #ffbc40; box-shadow: 0 0 20px rgba(245,166,35,0.25); }

/* RESULTS */
.results-empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; gap: 12px; color: var(--text-dim);
}
.empty-icon { font-size: 44px; opacity: 0.2; }
.error-msg {
  background: rgba(224,82,82,0.08);
  border: 1px solid rgba(224,82,82,0.25);
  border-radius: var(--radius);
  padding: 12px 16px;
  color: var(--red);
  font-size: 13px;
}
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 22px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 13px 15px;
}
.stat-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 600;
  color: var(--text-bright);
  line-height: 1;
  margin-bottom: 3px;
}
.sv-good { color: var(--green) !important; }
.sv-warn { color: var(--accent) !important; }
.sv-bad { color: var(--red) !important; }
.stat-lbl { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }

.sec-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px;
}
.sec-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.bar-card, .sheet-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 13px 15px;
  margin-bottom: 9px;
}
.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.card-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--text-bright);
}
.card-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
}
.card-sub span { color: var(--accent); }

.cut-legend {
  display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px;
}
.leg-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
}

.sum-table {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
}
.sum-table table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
.sum-table th { padding: 9px 13px; text-align: left; color: var(--text-dim); font-weight: 500; letter-spacing: 1px; text-transform: uppercase; font-size: 10px; border-bottom: 1px solid var(--border); }
.sum-table th:not(:first-child) { text-align: right; }
.sum-table td { padding: 8px 13px; border-bottom: 1px solid rgba(42,50,61,0.5); color: var(--text); }
.sum-table td:not(:first-child) { text-align: right; }
.sum-table tr:last-child td { border-bottom: none; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a4550; }
.hidden { display: none !important; }

.stock-avail {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
  margin-top: 9px;
  transition: border-color 0.2s;
}
.stock-avail:focus-within { border-color: var(--accent); }
.stock-avail-icon { font-size: 14px; flex-shrink: 0; }
.stock-avail-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px; text-transform: uppercase; flex: 1; }
.stock-avail input {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border);
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  width: 60px;
  text-align: center;
  outline: none;
  padding: 2px 4px;
}
.stock-avail input:focus { border-bottom-color: var(--accent); }
.stock-avail-unit { font-size: 10px; color: var(--text-dim); white-space: nowrap; }

.warn-banner {
  background: rgba(224,82,82,0.08);
  border: 1px solid rgba(224,82,82,0.35);
  border-radius: var(--radius);
  padding: 11px 14px;
  margin-bottom: 16px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.warn-banner-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.warn-banner-body { flex: 1; }
.warn-banner-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--red);
  margin-bottom: 3px;
}
.warn-banner-msg { font-size: 12px; color: #d48080; line-height: 1.5; }

.ok-banner {
  background: rgba(76,175,130,0.08);
  border: 1px solid rgba(76,175,130,0.3);
  border-radius: var(--radius);
  padding: 9px 13px;
  margin-bottom: 16px;
  font-size: 12px;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 8px;
}
.stat-card.limited { border-color: rgba(224,82,82,0.4); }
.stat-card.limited .stat-val { color: var(--red) !important; }
</style>
</head>
<body>

<header class="header">
  <div class="logo">Cut<span>Optima</span></div>
  <div class="tagline">Construction Material Cutting Optimizer</div>
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-1d" onclick="setMode('1d')">⟷ 1D Linear</button>
    <button class="mode-tab" id="tab-2d" onclick="setMode('2d')">⊡ 2D Sheet</button>
  </div>
</header>

<div class="app-body">

  <!-- LEFT INPUT PANEL -->
  <div class="left-panel">

    <div>
      <div class="slabel">Material Type</div>
      <div class="mat-grid">
        <button class="mat-btn active" data-mat="steel" onclick="selectMat('steel')">
          <span class="mat-icon">⚙</span><span class="mat-name">Steel / Metal</span>
        </button>
        <button class="mat-btn" data-mat="timber" onclick="selectMat('timber')">
          <span class="mat-icon">🪵</span><span class="mat-name">Timber / Wood</span>
        </button>
        <button class="mat-btn" data-mat="glass" onclick="selectMat('glass')">
          <span class="mat-icon">◻</span><span class="mat-name">Glass / Panels</span>
        </button>
        <button class="mat-btn" data-mat="pvc" onclick="selectMat('pvc')">
          <span class="mat-icon">⬭</span><span class="mat-name">PVC / Pipes</span>
        </button>
      </div>
    </div>

    <!-- 1D STOCK CONFIG -->
    <div id="cfg-1d">
      <div class="slabel">Stock Configuration</div>
      <div class="frow">
        <div class="field">
          <label>Standard Length</label>
          <select id="preset-1d" onchange="document.getElementById('custom-1d').value=''"></select>
        </div>
        <div class="field">
          <label>Custom (mm)</label>
          <input type="number" id="custom-1d" placeholder="or type..." min="100" step="100"
            onchange="if(this.value) document.getElementById('preset-1d').value=''">
        </div>
      </div>
      <div class="frow" style="margin-top:9px">
        <div class="field">
          <label>Kerf / Blade Width (mm)</label>
          <input type="number" id="kerf-1d" value="3" min="0" max="30" step="0.5">
        </div>
        <div class="field">
          <label>Available Stock (bars)</label>
          <input type="number" id="avail-1d" placeholder="Unlimited" min="1" step="1">
        </div>
      </div>
      <div class="stock-avail" id="avail-preview-1d" style="display:none">
        <span class="stock-avail-icon">📦</span>
        <span class="stock-avail-label">In stock</span>
        <input type="number" id="avail-1d-sync" min="1" step="1"
          oninput="document.getElementById('avail-1d').value=this.value;document.getElementById('avail-1d').dispatchEvent(new Event('input'))">
        <span class="stock-avail-unit">bars available</span>
      </div>
    </div>

    <!-- 2D STOCK CONFIG -->
    <div id="cfg-2d" class="hidden">
      <div class="slabel">Stock Configuration</div>
      <div class="field">
        <label>Standard Sheet Size</label>
        <select id="preset-2d" onchange="applyPreset2D()"></select>
      </div>
      <div class="frow" style="margin-top:9px">
        <div class="field">
          <label>Width (mm)</label>
          <input type="number" id="sw-2d" min="100" step="10">
        </div>
        <div class="field">
          <label>Height (mm)</label>
          <input type="number" id="sh-2d" min="100" step="10">
        </div>
      </div>
      <div class="frow" style="margin-top:9px">
        <div class="field">
          <label>Kerf (mm)</label>
          <input type="number" id="kerf-2d" value="3" min="0" max="30" step="0.5">
        </div>
        <div class="field">
          <label>Available Stock (sheets)</label>
          <input type="number" id="avail-2d" placeholder="Unlimited" min="1" step="1">
        </div>
      </div>
      <div class="frow" style="margin-top:9px">
        <div class="field" style="justify-content:center">
          <label class="check-row">
            <input type="checkbox" id="allow-rot" checked>
            <span>Allow Rotation</span>
          </label>
        </div>
      </div>
    </div>

    <!-- CUT LIST -->
    <div style="flex:1;min-height:0">
      <div class="slabel">Cut List</div>

      <div id="cl-1d">
        <div class="cut-header ch-1d">
          <span class="ch-label">Label</span>
          <span class="ch-label">Length mm</span>
          <span class="ch-label">Qty</span>
        </div>
        <div id="rows-1d"></div>
        <button class="add-btn" onclick="addRow1D()">+ Add Cut</button>
      </div>

      <div id="cl-2d" class="hidden">
        <div class="cut-header ch-2d">
          <span class="ch-label">Label</span>
          <span class="ch-label">W mm</span>
          <span class="ch-label">H mm</span>
          <span class="ch-label">Qty</span>
        </div>
        <div id="rows-2d"></div>
        <button class="add-btn" onclick="addRow2D()">+ Add Panel</button>
      </div>
    </div>

    <button class="opt-btn" onclick="runOptimize()">◈ OPTIMIZE CUTS</button>

  </div>

  <!-- RIGHT RESULTS PANEL -->
  <div class="right-panel" id="right-panel">
    <div class="results-empty" id="res-empty">
      <div class="empty-icon">◈</div>
      <p style="font-size:13px">Configure your cut list and click OPTIMIZE</p>
      <p style="font-size:11px">Visual layouts and waste analysis will appear here</p>
    </div>
    <div id="res-content" class="hidden"></div>
  </div>
</div>

<script>
// ─── CONSTANTS ─────────────────────────────────────────────────
const MATERIALS = {
  steel: {
    name: 'Steel / Metal',
    stock1D: [6000, 9000, 12000],
    stock2D: [
      {w:2440,h:1220,label:'2440×1220 mm'},
      {w:3000,h:1500,label:'3000×1500 mm'},
      {w:3048,h:1524,label:'3048×1524 mm (10×5 ft)'},
      {w:6000,h:2000,label:'6000×2000 mm'}
    ]
  },
  timber: {
    name: 'Timber / Wood',
    stock1D: [2400, 3000, 3600, 4200, 4800, 5400, 6000],
    stock2D: [
      {w:2440,h:1220,label:'2440×1220 mm (8×4 ft Standard)'},
      {w:2400,h:1200,label:'2400×1200 mm'},
      {w:3000,h:1200,label:'3000×1200 mm'},
      {w:3600,h:1200,label:'3600×1200 mm'}
    ]
  },
  glass: {
    name: 'Glass / Panels',
    stock1D: [2000, 2400, 3000, 3600, 4000, 4500, 5000, 6000],
    stock2D: [
      {w:3210,h:2250,label:'3210×2250 mm (Standard Float)'},
      {w:2440,h:1220,label:'2440×1220 mm'},
      {w:3300,h:2140,label:'3300×2140 mm (Jumbo Float)'},
      {w:6000,h:3210,label:'6000×3210 mm (XL Float)'}
    ]
  },
  pvc: {
    name: 'PVC / Pipes',
    stock1D: [3000, 6000],
    stock2D: [
      {w:2440,h:1220,label:'2440×1220 mm'},
      {w:3050,h:1525,label:'3050×1525 mm'}
    ]
  }
};

const COLORS = [
  '#f5a623','#5b9bd5','#4caf82','#c45de0','#e05252',
  '#50bcd4','#e8802a','#7ec45e','#d46b8a','#a0c4e8',
  '#f7c96b','#89b4e8','#f4a0a0','#80d4b4','#c4a0e0'
];

let mode = '1d';
let mat = 'steel';
let rowId1D = 0, rowId2D = 0;

// ─── INIT ──────────────────────────────────────────────────────
window.onload = () => {
  updatePresets();
  // Default 1D cuts
  addRow1D('Beam A', 2500, 3);
  addRow1D('Beam B', 1800, 5);
  addRow1D('Brace C', 900, 4);
  // Default 2D panels
  addRow2D('Panel A', 600, 400, 3);
  addRow2D('Panel B', 800, 500, 2);
};

// ─── MODE & MATERIAL ───────────────────────────────────────────
function setMode(m) {
  mode = m;
  ['1d','2d'].forEach(x => {
    document.getElementById('tab-'+x).classList.toggle('active', x === m);
    document.getElementById('cfg-'+x).classList.toggle('hidden', x !== m);
    document.getElementById('cl-'+x).classList.toggle('hidden', x !== m);
  });
  clearResults();
}

function selectMat(m) {
  mat = m;
  document.querySelectorAll('.mat-btn').forEach(b => b.classList.toggle('active', b.dataset.mat === m));
  updatePresets();
}

function updatePresets() {
  const data = MATERIALS[mat];
  const sel1d = document.getElementById('preset-1d');
  sel1d.innerHTML = data.stock1D.map(l =>
    `<option value="${l}">${l} mm (${(l/1000).toFixed(1)} m)</option>`).join('');

  const sel2d = document.getElementById('preset-2d');
  sel2d.innerHTML = data.stock2D.map((s,i) =>
    `<option value="${i}">${s.label}</option>`).join('');
  applyPreset2D();
}

function applyPreset2D() {
  const idx = parseInt(document.getElementById('preset-2d').value);
  const s = MATERIALS[mat].stock2D[idx];
  if (s) {
    document.getElementById('sw-2d').value = s.w;
    document.getElementById('sh-2d').value = s.h;
  }
}

// ─── ROW MANAGEMENT ────────────────────────────────────────────
function addRow1D(lbl='', len='', qty=1) {
  const id = rowId1D++;
  const color = COLORS[id % COLORS.length];
  const div = document.createElement('div');
  div.className = 'cut-row cr-1d';
  div.dataset.id = id;
  div.innerHTML = `
    <div class="cdot" style="background:${color}"></div>
    <input type="text" class="lbl" placeholder="Label" value="${lbl}">
    <input type="number" class="len" placeholder="mm" min="1" step="1" value="${len}">
    <input type="number" class="qty" min="1" max="9999" step="1" value="${qty}">
    <button class="del-btn" onclick="this.closest('.cut-row').remove()">×</button>
  `;
  document.getElementById('rows-1d').appendChild(div);
}

function addRow2D(lbl='', pw='', ph='', qty=1) {
  const id = rowId2D++;
  const color = COLORS[id % COLORS.length];
  const div = document.createElement('div');
  div.className = 'cut-row cr-2d';
  div.dataset.id = id;
  div.innerHTML = `
    <div class="cdot" style="background:${color}"></div>
    <input type="text" class="lbl" placeholder="Label" value="${lbl}">

    <input type="number" class="ph" placeholder="H" min="1" step="1" value="${ph}">
    <input type="number" class="qty" min="1" max="9999" step="1" value="${qty}">
    <button class="del-btn" onclick="this.closest('.cut-row').remove()">×</button>
  `;
  document.getElementById('rows-2d').appendChild(div);

// ─── PARSE INPUT ───────────────────────────────────────────────
function parseCuts1D() {
  return [...document.querySelectorAll('#rows-1d .cut-row')].map((r, i) => ({
    length: parseFloat(r.querySelector('.len').value) || 0,
    qty: parseInt(r.querySelector('.qty').value) || 1,
    label: r.querySelector('.lbl').value.trim() || `Cut ${i+1}`,
    colorIdx: parseInt(r.dataset.id)
  })).filter(c => c.length > 0);
}

function parsePanels2D() {
  return [...document.querySelectorAll('#rows-2d .cut-row')].map((r, i) => ({
    w: parseFloat(r.querySelector('.pw').value) || 0,
    h: parseFloat(r.querySelector('.ph').value) || 0,
    qty: parseInt(r.querySelector('.qty').value) || 1,
    label: r.querySelector('.lbl').value.trim() || `Panel ${i+1}`,
    colorIdx: parseInt(r.dataset.id)
  })).filter(p => p.w > 0 && p.h > 0);
}

// ─── 1D OPTIMIZER — First Fit Decreasing ──────────────────────
function optimize1D(cuts, stockLen, kerf) {
  let pieces = [];
  cuts.forEach(c => {
    for (let q = 0; q < c.qty; q++)
      pieces.push({ length: c.length, label: c.label, colorIdx: c.colorIdx });
  });

  if (!pieces.length) return { error: 'Add at least one cut to the list.' };

  const oversized = pieces.filter(p => p.length > stockLen);
  if (oversized.length) {
    const names = [...new Set(oversized.map(p => p.label))].join(', ');
    return { error: `These cuts exceed the stock length (${stockLen} mm): ${names}` };
  }

  pieces.sort((a, b) => b.length - a.length);

  const bars = [];
  for (const piece of pieces) {
    let placed = false;
    for (const bar of bars) {
      const extra = bar.cuts.length > 0 ? kerf : 0;
      if (bar.remaining >= piece.length + extra) {
        const start = stockLen - bar.remaining + (bar.cuts.length > 0 ? kerf : 0);
        bar.cuts.push({ start, length: piece.length, label: piece.label, colorIdx: piece.colorIdx });
        bar.remaining -= piece.length + extra;
        placed = true;
        break;
      }
    }
    if (!placed) {
      bars.push({
        remaining: stockLen - piece.length,
        cuts: [{ start: 0, length: piece.length, label: piece.label, colorIdx: piece.colorIdx }]
      });
    }
  }

  return { bars, stockLen, kerf };
}

// ─── 2D OPTIMIZER — Guillotine BSSF ───────────────────────────
function optimize2D(panels, sw, sh, kerf, allowRot) {
  let pieces = [];
  panels.forEach(p => {
    for (let q = 0; q < p.qty; q++)
      pieces.push({ w: p.w, h: p.h, label: p.label, colorIdx: p.colorIdx });
  });

  if (!pieces.length) return { error: 'Add at least one panel to the list.' };

  for (const p of pieces) {
    const ok = (p.w <= sw && p.h <= sh) || (allowRot && p.h <= sw && p.w <= sh);
    if (!ok) return {
      error: `Panel "${p.label}" (${p.w}×${p.h} mm) doesn't fit the sheet (${sw}×${sh} mm) even rotated.`
    };
  }

  pieces.sort((a, b) => b.w * b.h - a.w * a.h);

  const sheets = [];
  let remaining = [...pieces];

  while (remaining.length > 0) {
    const sheet = {
      w: sw, h: sh,
      placements: [],
      free: [{ x: 0, y: 0, w: sw, h: sh }]
    };

    let progress = true;
    while (progress && remaining.length > 0) {
      progress = false;
      for (let i = 0; i < remaining.length; i++) {
        const p = remaining[i];
        let best = bssf(sheet.free, p.w + kerf, p.h + kerf);
        let rotated = false;

        if (!best && allowRot && p.w !== p.h) {
          best = bssf(sheet.free, p.h + kerf, p.w + kerf);
          if (best) rotated = true;
        }

        if (best) {
          const pw = rotated ? p.h : p.w;
          const ph = rotated ? p.w : p.h;
          sheet.placements.push({ x: best.x, y: best.y, w: pw, h: ph, label: p.label, colorIdx: p.colorIdx, rotated });
          guillotineSplit(sheet.free, best, pw + kerf, ph + kerf);
          remaining.splice(i, 1);
          progress = true;
          break;
        }
      }
    }
    sheets.push(sheet);
  }

  return { sheets, sw, sh, kerf };
}

function bssf(rects, w, h) {
  let best = null, bestScore = Infinity;
  for (const r of rects) {
    if (r.w >= w && r.h >= h) {
      const score = Math.min(r.w - w, r.h - h);
      if (score < bestScore) { bestScore = score; best = r; }
    }
  }
  return best;
}

function guillotineSplit(rects, used, w, h) {
  rects.splice(rects.indexOf(used), 1);
  const lw = used.w - w, lh = used.h - h;
  if (lw > lh) {
    if (lw > 0) rects.push({ x: used.x + w, y: used.y, w: lw, h: used.h });
    if (lh > 0) rects.push({ x: used.x, y: used.y + h, w: w, h: lh });
  } else {
    if (lh > 0) rects.push({ x: used.x, y: used.y + h, w: used.w, h: lh });
    if (lw > 0) rects.push({ x: used.x + w, y: used.y, w: lw, h: h });
  }
}

// --- RUN ---
function runOptimize() {
  clearResults();

  if (mode === '1d') {
    const cuts = parseCuts1D();
    if (!cuts.length) { showError('Add at least one cut to the list.'); return; }

    let stockLen = parseFloat(document.getElementById('custom-1d').value);
    if (!stockLen) stockLen = parseFloat(document.getElementById('preset-1d').value);
    const kerf = parseFloat(document.getElementById('kerf-1d').value) || 0;
    const availRaw = document.getElementById('avail-1d').value;
    const avail1D = availRaw !== '' ? parseInt(availRaw) : null;

    const result = optimize1D(cuts, stockLen, kerf);
    if (result.error) { showError(result.error); return; }
    render1D(result, cuts, avail1D);

  } else {
    const panels = parsePanels2D();
    if (!panels.length) { showError('Add at least one panel to the list.'); return; }

    const sw = parseFloat(document.getElementById('sw-2d').value);
    const sh = parseFloat(document.getElementById('sh-2d').value);
    const kerf = parseFloat(document.getElementById('kerf-2d').value) || 0;
    const allowRot = document.getElementById('allow-rot').checked;
    const availRaw = document.getElementById('avail-2d').value;
    const avail2D = availRaw !== '' ? parseInt(availRaw) : null;

    if (!sw || !sh) { showError('Please enter a valid sheet size.'); return; }

    const result = optimize2D(panels, sw, sh, kerf, allowRot);
    if (result.error) { showError(result.error); return; }
    render2D(result, panels, avail2D);
  }
}

// ─── RENDER 1D ─────────────────────────────────────────────────
function render1D(result, cuts, avail) {
  const { bars, stockLen, kerf } = result;
  const totalBars = bars.length;
  const totalMat = totalBars * stockLen;
  const totalUsed = bars.reduce((s, b) => {
    const cuts_len = b.cuts.reduce((a, c) => a + c.length, 0);
    const kerfs = b.cuts.length > 1 ? (b.cuts.length - 1) * kerf : 0;
    return s + cuts_len + kerfs;
  }, 0);
  const wasteTotal = totalMat - totalUsed;
  const wastePct = ((wasteTotal / totalMat) * 100).toFixed(1);
  const totalPieces = bars.reduce((s, b) => s + b.cuts.length, 0);
  const wClass = wastePct < 10 ? 'sv-good' : wastePct < 20 ? 'sv-warn' : 'sv-bad';

  // Stock availability check
  const shortage = avail !== null && totalBars > avail;
  const surplus  = avail !== null && totalBars <= avail;
  let availBanner = '';
  if (shortage) {
    const need = totalBars - avail;
    availBanner = `<div class="warn-banner">
      <div class="warn-banner-icon">⚠️</div>
      <div class="warn-banner-body">
        <div class="warn-banner-title">INSUFFICIENT STOCK</div>
        <div class="warn-banner-msg">
          Your cut list requires <strong>${totalBars} bars</strong> but you only have <strong>${avail} bars</strong> available.
          You need to procure <strong>${need} more bar${need>1?'s':''}</strong> of ${stockLen} mm to complete this job.
        </div>
      </div>
    </div>`;
  } else if (surplus) {
    const leftover = avail - totalBars;
    availBanner = `<div class="ok-banner">
      ✔ Stock sufficient &mdash; using <strong style="margin:0 4px">${totalBars}</strong> of your
      <strong style="margin:0 4px">${avail}</strong> available bars.
      <strong style="margin-left:6px;color:var(--accent)">${leftover} bar${leftover!==1?'s':''} remain unused.</strong>
    </div>`;
  }

  let html = availBanner + `
  <div class="stats-bar">
    <div class="stat-card${shortage?' limited':''}" >
      <div class="stat-val${shortage?' sv-bad':''}">${totalBars}${avail!==null?' / '+avail:''}</div>
      <div class="stat-lbl">Bars Needed${avail!==null?' / Available':''}</div>
    </div>
    <div class="stat-card"><div class="stat-val">${totalPieces}</div><div class="stat-lbl">Total Pieces Cut</div></div>
    <div class="stat-card"><div class="stat-val ${wClass}">${wastePct}%</div><div class="stat-lbl">Material Waste</div></div>
    <div class="stat-card"><div class="stat-val">${(totalMat/1000).toFixed(2)}m</div><div class="stat-lbl">Total Length Bought</div></div>
  </div>
  <div class="sec-title">Cut Layout — ${totalBars} Bar${totalBars>1?'s':''} × ${stockLen} mm each</div>`;

  bars.forEach((bar, bi) => {
    const wp = ((bar.remaining / stockLen) * 100).toFixed(1);
    html += `
    <div class="bar-card">
      <div class="card-meta">
        <span class="card-title">Bar #${bi+1} &mdash; ${stockLen} mm</span>
        <span class="card-sub">${bar.cuts.length} cuts &nbsp;|&nbsp; Waste: <span>${bar.remaining} mm (${wp}%)</span></span>
      </div>
      <div>${barSVG(bar, stockLen, kerf)}</div>
      <div class="cut-legend">
        ${bar.cuts.map(c =>
          `<div class="leg-item"><div class="cdot" style="background:${COLORS[c.colorIdx%COLORS.length]}"></div>${c.label}: ${c.length}mm</div>`
        ).join('')}
        ${bar.remaining > 0 ? `<div class="leg-item"><div class="cdot" style="background:#2a323d;border:1px solid #3a4550"></div>Waste: ${bar.remaining}mm</div>` : ''}
      </div>
    </div>`;
  });

  html += `<div class="sec-title" style="margin-top:20px">Cut Summary</div>
  <div class="sum-table"><table>
    <thead><tr><th>Label</th><th>Length</th><th>Qty</th><th>Total Length</th></tr></thead>
    <tbody>
    ${cuts.map(c => `
      <tr>
        <td><div style="display:flex;align-items:center;gap:8px"><div class="cdot" style="background:${COLORS[c.colorIdx%COLORS.length]}"></div>${c.label}</div></td>
        <td>${c.length} mm</td>
        <td>×${c.qty}</td>
        <td style="color:var(--accent)">${c.length*c.qty} mm</td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;

  showResults(html);
}

function barSVG(bar, stockLen, kerf) {
  const W = 620, H = 40;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">`;
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="#141a22" rx="4"/>`;

  bar.cuts.forEach((cut, i) => {
    const x = (cut.start / stockLen) * W;
    const w = (cut.length / stockLen) * W;
    const color = COLORS[cut.colorIdx % COLORS.length];

    if (i > 0 && kerf > 0) {
      const kx = ((cut.start - kerf) / stockLen) * W;
      const kw = Math.max((kerf / stockLen) * W, 1.5);
      s += `<rect x="${kx}" y="0" width="${kw}" height="${H}" fill="#0d1217"/>`;
    }

    s += `<rect x="${x+0.5}" y="1" width="${Math.max(w-1,0.5)}" height="${H-2}" fill="${color}" rx="2" opacity="0.88"/>`;

    if (w > 36) {
      const fs = Math.min(11, Math.max(8, w / 8));
      s += `<text x="${x + w/2}" y="${H/2 + fs*0.37}" text-anchor="middle"
        font-family="JetBrains Mono,monospace" font-size="${fs}" fill="#111" font-weight="700">${cut.length}</text>`;
    }
  });

  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="none" stroke="var(--border)" stroke-width="1" rx="4"/>`;
  s += '</svg>';
  return s;
}

// ─── RENDER 2D ─────────────────────────────────────────────────
function render2D(result, panels, avail) {
  const { sheets, sw, sh } = result;
  const totalSheets = sheets.length;
  const totalArea = totalSheets * sw * sh;
  const usedArea = sheets.reduce((s, sh2) => s + sh2.placements.reduce((a, p) => a + p.w*p.h, 0), 0);
  const wastePct = (((totalArea - usedArea) / totalArea) * 100).toFixed(1);
  const totalPanels = sheets.reduce((s, sh2) => s + sh2.placements.length, 0);
  const wClass = wastePct < 15 ? 'sv-good' : wastePct < 30 ? 'sv-warn' : 'sv-bad';

  // Stock availability check
  const shortage = avail !== null && totalSheets > avail;
  const surplus  = avail !== null && totalSheets <= avail;
  let availBanner = '';
  if (shortage) {
    const need = totalSheets - avail;
    availBanner = `<div class="warn-banner">
      <div class="warn-banner-icon">⚠️</div>
      <div class="warn-banner-body">
        <div class="warn-banner-title">INSUFFICIENT STOCK</div>
        <div class="warn-banner-msg">
          Your panel list requires <strong>${totalSheets} sheets</strong> but you only have <strong>${avail} sheets</strong> available.
          You need to procure <strong>${need} more sheet${need>1?'s':''}</strong> of ${sw}×${sh} mm to complete this job.
        </div>
      </div>
    </div>`;
  } else if (surplus) {
    const leftover = avail - totalSheets;
    availBanner = `<div class="ok-banner">
      ✔ Stock sufficient &mdash; using <strong style="margin:0 4px">${totalSheets}</strong> of your
      <strong style="margin:0 4px">${avail}</strong> available sheets.
      <strong style="margin-left:6px;color:var(--accent)">${leftover} sheet${leftover!==1?'s':''} remain unused.</strong>
    </div>`;
  }

  let html = availBanner + `
  <div class="stats-bar">
    <div class="stat-card${shortage?' limited':''}" >
      <div class="stat-val${shortage?' sv-bad':''}">${totalSheets}${avail!==null?' / '+avail:''}</div>
      <div class="stat-lbl">Sheets Needed${avail!==null?' / Available':''}</div>
    </div>
    <div class="stat-card"><div class="stat-val">${totalPanels}</div><div class="stat-lbl">Total Panels Cut</div></div>
    <div class="stat-card"><div class="stat-val ${wClass}">${wastePct}%</div><div class="stat-lbl">Area Waste</div></div>
    <div class="stat-card"><div class="stat-val">${((usedArea/totalArea)*100).toFixed(1)}%</div><div class="stat-lbl">Material Used</div></div>
  </div>
  <div class="sec-title">Sheet Layout — ${sw}×${sh} mm per sheet</div>`;

  const MAXW = 560;
  const scale = MAXW / sw;
  const dH = Math.round(sh * scale);

  sheets.forEach((sheet, si) => {
    const sUsed = sheet.placements.reduce((a, p) => a + p.w*p.h, 0);
    const sWaste = ((1 - sUsed / (sw*sh)) * 100).toFixed(1);
    html += `
    <div class="sheet-card">
      <div class="card-meta">
        <span class="card-title">Sheet #${si+1} &mdash; ${sw}×${sh} mm</span>
        <span class="card-sub">${sheet.placements.length} panel${sheet.placements.length!==1?'s':''} &nbsp;|&nbsp; Waste: <span>${sWaste}%</span></span>
      </div>
      <div style="overflow-x:auto">${sheetSVG(sheet, sw, sh, MAXW, dH, scale)}</div>
      <div class="cut-legend">
        ${sheet.placements.map(p =>
          `<div class="leg-item"><div class="cdot" style="background:${COLORS[p.colorIdx%COLORS.length]}"></div>${p.label}: ${p.w}×${p.h}mm${p.rotated?' ↻':''}</div>`
        ).join('')}
      </div>
    </div>`;
  });

  html += `<div class="sec-title" style="margin-top:20px">Panel Summary</div>
  <div class="sum-table"><table>
    <thead><tr><th>Label</th><th>Dimensions</th><th>Qty</th><th>Total Area</th></tr></thead>
    <tbody>
    ${panels.map(p => `
      <tr>
        <td><div style="display:flex;align-items:center;gap:8px"><div class="cdot" style="background:${COLORS[p.colorIdx%COLORS.length]}"></div>${p.label}</div></td>
        <td>${p.w}×${p.h} mm</td>
        <td>×${p.qty}</td>
        <td style="color:var(--accent)">${((p.w*p.h*p.qty)/1e6).toFixed(4)} m²</td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;

  showResults(html);
}

function sheetSVG(sheet, sw, sh, dW, dH, scale) {
  const pad = 1;
  let s = `<svg viewBox="0 0 ${dW+2} ${dH+16}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;display:block">`;

  // Background
  s += `<rect x="${pad}" y="${pad}" width="${dW}" height="${dH}" fill="#141a22" stroke="var(--border)" stroke-width="1" rx="3"/>`;

  // Grid (every 200mm)
  const gStep = Math.max(1, Math.round(200 * scale));
  for (let gx = gStep; gx < dW; gx += gStep) {
    s += `<line x1="${pad+gx}" y1="${pad}" x2="${pad+gx}" y2="${pad+dH}" stroke="#1e252e" stroke-width="0.5"/>`;
  }
  for (let gy = gStep; gy < dH; gy += gStep) {
    s += `<line x1="${pad}" y1="${pad+gy}" x2="${pad+dW}" y2="${pad+gy}" stroke="#1e252e" stroke-width="0.5"/>`;
  }

  // Placements
  sheet.placements.forEach(p => {
    const x = pad + p.x * scale;
    const y = pad + p.y * scale;
    const w = p.w * scale - 1;
    const h = p.h * scale - 1;
    const color = COLORS[p.colorIdx % COLORS.length];
    s += `<rect x="${x}" y="${y}" width="${Math.max(w,0.5)}" height="${Math.max(h,0.5)}" fill="${color}" opacity="0.78" rx="2"/>`;
    s += `<rect x="${x}" y="${y}" width="${Math.max(w,0.5)}" height="${Math.max(h,0.5)}" fill="none" stroke="${color}" stroke-width="1.5" rx="2"/>`;

    if (w > 35 && h > 22) {
      const fs = Math.min(11, Math.max(7, Math.min(w,h) / 5));
      s += `<text x="${x+w/2}" y="${y+h/2 - fs*0.5}" text-anchor="middle"
        font-family="JetBrains Mono,monospace" font-size="${fs}" fill="#111" font-weight="700">${p.label}${p.rotated?' ↻':''}</text>`;
      if (h > 30) {
        s += `<text x="${x+w/2}" y="${y+h/2 + fs*1.1}" text-anchor="middle"
          font-family="JetBrains Mono,monospace" font-size="${Math.max(6,fs*0.82)}" fill="#111">${p.w}×${p.h}</text>`;
      }
    }
  });

  // Dimension label
  s += `<text x="${pad + dW/2}" y="${pad+dH+13}" text-anchor="middle"
    font-family="JetBrains Mono,monospace" font-size="9" fill="var(--text-dim)">${sw} mm wide × ${sh} mm tall</text>`;

  s += '</svg>';
  return s;
}

// ─── UI HELPERS ────────────────────────────────────────────────
function showResults(html) {
  document.getElementById('res-empty').classList.add('hidden');
  document.getElementById('res-content').classList.remove('hidden');
  document.getElementById('res-content').innerHTML = html;
}
function showError(msg) {
  document.getElementById('res-empty').classList.add('hidden');
  document.getElementById('res-content').classList.remove('hidden');
  document.getElementById('res-content').innerHTML = `<div class="error-msg">⚠ ${msg}</div>`;
}
function clearResults() {
  document.getElementById('res-empty').classList.remove('hidden');
  document.getElementById('res-content').classList.add('hidden');
  document.getElementById('res-content').innerHTML = '';
}
